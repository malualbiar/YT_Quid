services:
  - type: web
    name: yt-quid
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: RENDER
        value: "true"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ""          # Leave blank; RENDER_EXTERNAL_HOSTNAME is picked up automatically
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      # Bind the managed PostgreSQL database below
      - key: DATABASE_URL
        fromDatabase:
          name: yt-quid-db
          property: connectionString
      # Fill these in the Render dashboard or via the CLI:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: TIME_ZONE
        value: UTC
      - key: SYNC_INTERVAL_HOURS
        value: "6"
    disk:
      name: media
      mountPath: /opt/render/project/src/media
      sizeGB: 5

databases:
  - name: yt-quid-db
    databaseName: ytquid
    user: ytquid
    plan: free
