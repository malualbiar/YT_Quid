services:
  - type: web
    name: yt-quid
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    # 1 worker keeps memory within the free tier's 512 MB limit.
    # SQLite is used (no DATABASE_URL set) — the db file lives in the
    # ephemeral filesystem; it resets on each deploy, which is fine for
    # the demo data seeded by build.sh.
    startCommand: "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: RENDER
        value: "true"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ""          # Leave blank; RENDER_EXTERNAL_HOSTNAME is picked up automatically
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings
      # Fill these in the Render dashboard after the first deploy:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: TIME_ZONE
        value: UTC
      - key: SYNC_INTERVAL_HOURS
        value: "6"
    # No disk block — persistent disks are paid.
    # Media files (generated videos, downloads) are written to the
    # ephemeral filesystem and will be lost on redeploy.
    # Upgrade to a paid plan and uncomment the block below to persist them:
    # disk:
    #   name: media
    #   mountPath: /opt/render/project/src/media
    #   sizeGB: 5
